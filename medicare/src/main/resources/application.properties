spring.application.name=medicare
server.port=8080

# MySQL Database Configuration (Environment variable support with default fallbacks)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/MediCareDbdotnet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Gourav}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Exact naming strategy to preserve PascalCase table and column names matching EF Core
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# JWT Authentication (Matches .NET configuration & claims)
jwt.secret=${JWT_KEY:MediCare_SuperSecret_Key_2026_Gourav@1234567890@@112@}
jwt.issuer=${JWT_ISSUER:MediCareAPI}
jwt.audience=${JWT_AUDIENCE:MediCareClient}
jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# Email Service Configuration (Matches .NET SMTP settings)
spring.mail.host=${EMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_SMTP_PORT:587}
spring.mail.username=${EMAIL_SENDER_EMAIL:gk23012004@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:jjse inuq uvsw gapa}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
medicare.email.sender-name=${EMAIL_SENDER_NAME:MediCare}

# Background Medicine Reminder Scheduler
# Can be toggled false if .NET background service is already active on the same database
medicare.reminder.enabled=${MEDICARE_REMINDER_ENABLED:true}
medicare.reminder.interval-ms=15000

# Jackson JSON Handling
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false